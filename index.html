  <style>
    @font-face {
      font-family: 'AnanthaSignature';

    :root {
      --bg-canvas: #040914;
      --bg-panel: #0a1324;

      --bg-card-inner: #070e1c;
      --border-subtle: #1c2e4c;

<body>

  <div id="app-viewport">
    
    <div class="top-nav" id="topNav" style="display: none;">
      <div class="nav-brand-left">
        <div class="toefl-badge">
          <svg class="toefl-spark" viewBox="0 0 100 100">
            <rect x="42" y="8" width="16" height="84" rx="4" transform="rotate(0 50 50)"/>
            <rect x="42" y="8" width="16" height="84" rx="4" transform="rotate(60 50 50)"/>
            <rect x="42" y="8" width="16" height="84" rx="4" transform="rotate(120 50 50)"/>
          </svg>
          <span class="toefl-name">toefl ibt</span>
          <span class="toefl-reg">®</span>
        </div>
        <span class="nav-title">OFFICIAL TOEFL iBT PREPARATION SUITE (MOCKS 01–30)</span>
      </div>

      <div class="nav-brand-right">
        <div class="coin-display">
          <span>🪙</span> <span id="navCoins">25</span> Coins
        </div>
        <div class="progress-track" id="navPageTrack">Candidate Profile</div>
        <div class="company-logo-slot">
          <img src="logo.png" alt="JM ELT Solutions" onerror="this.style.display='none'">
        </div>
      </div>
    </div>

    <div class="screen-container" id="mountNode"></div>

    <div class="institutional-bottom">
      <span>Official TOEFL iBT Simulation Suite • Modular Architecture</span>
      <span>All Rights Reserved © by <strong>Dr. Jesús Miguel Lima E.</strong> • CEO of JM ELT Solutions</span>
    </div>

  </div>

  <script>
    const STORAGE_KEY = "toefl_mastery_user_profile";
    const MOCK_COMPLETION_KEY = "toefl_mocks_status_01_30";
    let activeScreen = 1;

    let userState = {
      name: "",
      birthYear: "",
      coins: 25
    };

    let mocksStatus = {};

    function initData() {
      // Initialize 30 mocks status
      for (let m = 1; m <= 30; m++) {
        mocksStatus[m] = { 
          completed: false, 
          unlocked: m === 1,
          readingScore: null,
          listeningScore: null,
          writingScore: null
        };
      }

      const rawUser = localStorage.getItem(STORAGE_KEY);
      if (rawUser) {
        try {
          userState = { ...userState, ...JSON.parse(rawUser) };
        } catch(e) {}
      }

      const rawMocks = localStorage.getItem(MOCK_COMPLETION_KEY);
      if (rawMocks) {
        try {
          mocksStatus = { ...mocksStatus, ...JSON.parse(rawMocks) };
        } catch(e) {}
      }

      // Check single mock scores in localStorage and unlock next
      for (let m = 1; m <= 30; m++) {
        const padded = String(m).padStart(2, '0');
        const rScore = localStorage.getItem(`toefl_reading_score_${padded}`);
        if (rScore !== null) {
          mocksStatus[m].readingScore = rScore;
        }
        
        // Progression unlock
        if (m > 1 && mocksStatus[m - 1] && mocksStatus[m - 1].completed) {
          mocksStatus[m].unlocked = true;
        }
      }
    }

    function syncStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(userState));
      localStorage.setItem(MOCK_COMPLETION_KEY, JSON.stringify(mocksStatus));
      const elCoins = document.getElementById('navCoins');
      if (elCoins) elCoins.innerText = userState.coins || 25;
    }

    function setScreen(step) {
      activeScreen = step;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function render() {
      const mount = document.getElementById('mountNode');
      const nav = document.getElementById('topNav');
      const track = document.getElementById('navPageTrack');
      mount.innerHTML = '';

      if (activeScreen === 1) {
        nav.style.display = 'none';
        renderScreen1(mount);
      } else if (activeScreen === 2) {
        nav.style.display = 'flex';
        track.innerText = 'Candidate Profile';
        renderScreen2(mount);
      } else if (activeScreen === 3) {
        nav.style.display = 'flex';
        track.innerText = 'Simulation Center (Mocks 01–30)';
        renderScreen3(mount);
      }
      syncStorage();
    }

    function renderScreen1(mount) {
      mount.innerHTML = `
        <div class="slide">
          <div class="cover-fullscreen">
            <div>
              <div class="cover-top-badge-row">
                <div class="toefl-badge" style="padding: 5px 12px;">
                  <svg class="toefl-spark" style="width:18px; height:18px;" viewBox="0 0 100 100">
                    <rect x="42" y="8" width="16" height="84" rx="4" transform="rotate(0 50 50)"/>
                    <rect x="42" y="8" width="16" height="84" rx="4" transform="rotate(60 50 50)"/>
                    <rect x="42" y="8" width="16" height="84" rx="4" transform="rotate(120 50 50)"/>
                  </svg>
                  <span class="toefl-name" style="font-size:16px;">toefl ibt</span>
                  <span class="toefl-reg" style="font-size:9px; margin-top:-8px;">®</span>
                </div>

                <div class="company-logo-slot" style="height:48px; max-width:160px;">
                  <img src="logo.png" alt="JM ELT Solutions" onerror="this.style.display='none'">
                </div>
              </div>

              <div class="cover-headings-group">
                <div class="main-section-title">Official Full-Length Examination Suite for TOEFL iBT Candidates</div>
                <div class="main-task-title">Final TOEFL iBT Mocks (01–30)</div>
              </div>

              <div class="welcome-text-block">
                <p class="welcome-en">
                  Welcome to the official full-length diagnostic suite. Complete each standard examination through its integrated sequence: <strong>Reading ➔ Listening ➔ Writing</strong> under authentic ETS testing criteria.
                </p>
                <p class="welcome-es">
                  (Bienvenido a la suite oficial de simulacros integrales. Completa cada examen en su orden oficial: <strong>Reading ➔ Listening ➔ Writing</strong> bajo los estándares oficiales de evaluación.)
                </p>
              </div>
            </div>

            <div class="cover-bottom-row">
              <div class="signature-container">
                <div class="signature-name-wrapper">
                  <span class="signature-name">by Dr. Jesús Miguel Lima E.</span>
                </div>
                <div class="signature-roles">
                  <span class="role-highlight">CEO of JM ELT Solutions</span>
                  <span>Celta & Delta Trainer</span>
                  <span>Exam Trainer</span>
                  <span>Teacher Trainer</span>
                  <span>University Professor</span>
                </div>
              </div>

              <div class="cover-action-wrapper">
                <button class="btn-fast-mock" onclick="launchMock01Direct()">
                  <span>⚡</span> Direct Mock 01 ➔
                </button>
                <button class="btn-launch-large" onclick="setScreen(2)">
                  <span>🚀</span> Begin Program ➔
                </button>
              </div>
            </div>

          </div>
        </div>
      `;
    }

    function launchMock01Direct() {
      if (userState.name && userState.name.trim().length > 0) {
        window.location.href = 'reading-mock01.html';
      } else {
        setScreen(2);
      }
    }

    function renderScreen2(mount) {
      mount.innerHTML = `
        <div class="slide">
          <div class="center-stage">
            <div class="center-tag"><span>🎓</span> STEP 1: CANDIDATE IDENTITY</div>
            <h2 class="center-title">CANDIDATE REGISTRATION</h2>
            <div style="max-width: 580px;">
              <p style="font-size:15px; color:#e2e8f0; line-height:1.5;">Enter your first name and birth year to initialize your personal tracking vault and test records.</p>
              <p style="font-style:italic; font-size:13px; color:var(--text-spanish); margin-top:4px;">(Ingresa tu nombre y año de nacimiento para guardar tu progreso de forma automática.)</p>
            </div>

            <div class="minimal-card">
              <div class="field-group">
                <label for="txtName">First Name (Nombre)</label>
                <input type="text" id="txtName" class="field-input" placeholder="e.g. Maria" value="${userState.name || ''}" autocomplete="off">
              </div>
              <div class="field-group">
                <label for="txtYear">Birth Year / PIN (Año de Nacimiento)</label>
                <input type="number" id="txtYear" class="field-input" placeholder="e.g. 2001" min="1950" max="2026" value="${userState.birthYear || ''}">
              </div>

              <div class="companion-bubble-box">
                <div class="companion-clippy-visual">
                  <span class="companion-avatar-icon">📎</span>
                  <span class="companion-tag">Klippy</span>
                </div>
                <div class="companion-text">
                  ${userState.name 
                    ? `"Welcome back, <strong>${userState.name}</strong>! Your simulator vault is active. You will start with Mock 01 Reading and advance consecutively."`
                    : `"Hi there! I'm <strong>Klippy</strong>, your academic mentor. I will track your diagnostic progress across Mocks 01 to 30!"`}
                </div>
              </div>
            </div>
          </div>

          <div class="bottom-bar">
            <button class="btn-act btn-outline" onclick="setScreen(1)">
              <span>⬅</span> Back to Cover
            </button>
            <button class="btn-act btn-primary" onclick="confirmProfile()">
              <span>👉</span> Continue to Simulation Center ➔
            </button>
          </div>
        </div>
      `;
    }

    function confirmProfile() {
      const name = document.getElementById('txtName').value.trim();
      const year = document.getElementById('txtYear').value.trim();

      if (!name) {
        alert("Please enter your name.");
        return;
      }
      if (!year || year.length !== 4) {
        alert("Please enter a valid 4-digit birth year (e.g. 2001).");
        return;
      }

      userState.name = name;
      userState.birthYear = year;
      syncStorage();
      setScreen(3);
    }

    function renderScreen3(mount) {
      let mocksHtml = '';

      for (let i = 1; i <= 30; i++) {
        const padded = String(i).padStart(2, '0');
        const isUnlocked = mocksStatus[i] && mocksStatus[i].unlocked;
        const isCompleted = mocksStatus[i] && mocksStatus[i].completed;
        const isCurrent = isUnlocked && !isCompleted;
        const scoreBadge = mocksStatus[i].readingScore !== null 
          ? `<span class="mock-score-pill">Reading: ${mocksStatus[i].readingScore}/30</span>` 
          : '';

        let statusBadge = '';
        if (isCompleted) {
          statusBadge = `<span class="mock-badge-status badge-done">✔ COMPLETED</span>`;
        } else if (isUnlocked) {
          statusBadge = `<span class="mock-badge-status badge-ready">🟢 AVAILABLE</span>`;
        } else {
          statusBadge = `<span class="mock-badge-status badge-locked">🔒 LOCKED (COMPLETE MOCK ${i - 1})</span>`;
        }

        mocksHtml += `
          <div class="mock-block ${isUnlocked ? 'unlocked' : 'locked'} ${isCurrent ? 'current' : ''}">
            <div class="mock-header-row">
              <div class="mock-title">
                <span>📋 TOEFL iBT Mock Test N° ${padded}</span>
                ${scoreBadge}
              </div>
              <div>${statusBadge}</div>
            </div>
            
            <div class="mock-sections-grid">
              <!-- Step 1: Reading Section -->
              <a href="${isUnlocked ? `reading-mock${padded}.html` : '#'}" 
                 class="section-chip-btn ${!isUnlocked ? 'btn-disabled' : ''}">
                <div>
                  <div>📖 1. Reading Section</div>
                  <span class="chip-tag">Modular Format • 45 Min</span>
                </div>
                <span>➔</span>
              </a>

              <!-- Step 2: Listening Section -->
              <a href="${isUnlocked ? `listening-mock${padded}.html` : '#'}" 
                 class="section-chip-btn ${!isUnlocked ? 'btn-disabled' : ''}">
                <div>
                  <div>🎧 2. Listening Section</div>
                  <span class="chip-tag">Conversations & Lectures</span>
                </div>
                <span>➔</span>
              </a>

              <!-- Step 3: Writing Section -->
              <a href="${isUnlocked ? `writing-mock${padded}.html` : '#'}" 
                 class="section-chip-btn ${!isUnlocked ? 'btn-disabled' : ''}">
                <div>
                  <div>✍️ 3. Writing Section</div>
                  <span class="chip-tag">Academic Discussion & Tasks</span>
                </div>
                <span>➔</span>
              </a>
            </div>
          </div>
        `;
      }

      mount.innerHTML = `
        <div class="slide">
          <div class="center-stage">
            <div class="center-tag"><span>🧭</span> STEP 2: SIMULATION PORTAL</div>
            <h2 class="center-title">OFFICIAL TEST BATTERY: MOCKS 01 TO 30</h2>
            <div style="max-width: 720px; margin-bottom: 8px;">
              <p style="font-size:15px; color:#e2e8f0; line-height:1.5;">
                Candidate: <strong style="color:var(--accent-gold);">${userState.name}</strong> • Follow the official articulated path: <strong>Reading ➔ Listening ➔ Writing</strong>.
              </p>
              <p style="font-style:italic; font-size:13px; color:var(--text-spanish); margin-top:4px;">
                (Cada examen inicia con la sección de lectura y se enlaza consecutivamente al finalizar.)
              </p>
            </div>

            <div class="progress-summary-card">
              ${mocksHtml}
            </div>
          </div>

          <div class="bottom-bar">
            <button class="btn-act btn-outline" onclick="setScreen(2)">
              <span>⬅</span> Back to Profile
            </button>
            <button class="btn-act btn-primary" onclick="window.location.href='reading-mock01.html'">
              <span>🚀</span> Start Mock 01 Reading ➔
            </button>
          </div>
        </div>
      `;
    }

    initData();
    render();
  </script>
</body>
</html>
